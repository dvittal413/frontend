<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Charset + viewport -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />

    <!-- Primary title -->
    <title>DVShortyLinks — Smart URL Shortener & Link Monetization (High CPM)</title>

    <!-- Description (150–160 chars) -->
    <meta
      name="description"
      content="DVShortyLinks is a fast URL shortener with built-in monetization. Create short links, track clicks, and earn with high CPM rates. Simple, secure, and scalable."
    />

    <!-- Robots -->
    <meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- Keywords (optional) -->
    <meta
      name="keywords"
      content="URL shortener, link shortener, short links, link monetization, earn from links, CPM, DVShortyLinks"
    />

    <!-- App/brand -->
    <meta name="application-name" content="DVShortyLinks" />
    <meta name="apple-mobile-web-app-title" content="DVShortyLinks" />
    <meta name="theme-color" content="#111827" />
    <meta name="color-scheme" content="light dark" />

    <!-- Canonical (UPDATE to your real domain) -->
    <link rel="canonical" href="https://www.dvshortylinks.com/" />

    <!-- Hreflang (edit/expand if you localize) -->
    <link rel="alternate" href="https://www.dvshortylinks.com/" hreflang="x-default" />
    <link rel="alternate" href="https://www.dvshortylinks.com/" hreflang="en" />
    <link rel="alternate" href="https://www.dvshortylinks.com/in/" hreflang="en-IN" />

    <!-- PWA / Icons -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/apple-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="%PUBLIC_URL%/icons/icon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="%PUBLIC_URL%/icons/icon-192.png" />
    <link rel="shortcut icon" href="%PUBLIC_URL%/images/dv_favicon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- Open Graph -->
    <meta property="og:site_name" content="DVShortyLinks" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="DVShortyLinks — Smart URL Shortener & Link Monetization" />
    <meta
      property="og:description"
      content="Shorten URLs, track clicks, and earn via high CPM monetization. Powerful analytics and admin tools."
    />
    <meta property="og:url" content="https://www.dvshortylinks.com/" />
    <meta property="og:image" content="%PUBLIC_URL%/og-image.jpg" />
    <meta property="og:image:alt" content="DVShortyLinks — shorten, track and monetize your links" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="DVShortyLinks — Smart URL Shortener & Monetization" />
    <meta
      name="twitter:description"
      content="Create short links, analyze clicks, and earn with high CPM. Simple, secure, scalable."
    />
    <meta name="twitter:image" content="%PUBLIC_URL%/og-image.jpg" />
    <!-- <meta name="twitter:site" content="@yourhandle" /> -->

    <!-- Performance hints -->
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin />
    <link rel="dns-prefetch" href="//cdnjs.cloudflare.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="//fonts.gstatic.com" />
    <link rel="preconnect" href="https://www.googletagmanager.com" crossorigin />
    <link rel="preconnect" href="https://www.google-analytics.com" crossorigin />

    <!-- Font Awesome 6 (CDN) -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <!-- Search Console / webmaster verifications (replace as needed) -->
    <!-- <meta name="google-site-verification" content="YOUR_GOOGLE_VERIFICATION_TOKEN" /> -->
    <!-- <meta name="msvalidate.01" content="YOUR_BING_VERIFICATION_TOKEN" /> -->

    <!-- Structured Data: Organization -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "DVShortyLinks",
        "url": "https://www.dvshortylinks.com/",
        "logo": "https://www.dvshortylinks.com/og-image.jpg",
        "sameAs": [
          "https://twitter.com/YOUR_HANDLE",
          "https://www.facebook.com/YOUR_PAGE"
        ]
      }
    </script>
    <!-- Structured Data: WebSite + Sitelinks Search -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "DVShortyLinks",
        "url": "https://www.dvshortylinks.com/",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://www.dvshortylinks.com/search?q={query}",
          "query-input": "required name=query"
        }
      }
    </script>
    <!-- Structured Data: WebApplication -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "DVShortyLinks",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web",
        "url": "https://www.dvshortylinks.com/",
        "description": "Smart URL shortener with built-in monetization and analytics.",
        "inLanguage": "en"
      }
    </script>

    <!-- Google Analytics (gtag.js - GA4) -->
    <!-- Replace G-XXXXXXXXXX with your GA4 Measurement ID -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      // Basic GA init
      gtag('js', new Date());
      gtag('config', 'G-XXXXXXXXXX', {
        anonymize_ip: true,
        allow_google_signals: false,   // set true if you use Signals
        // Send a page_view automatically on load
        send_page_view: true
      });
      // Optional: Google Consent Mode v2 defaults (edit per your policy)
      // gtag('consent', 'default', {
      //   ad_user_data: 'denied',
      //   ad_personalization: 'denied',
      //   ad_storage: 'denied',
      //   analytics_storage: 'granted',
      //   functionality_storage: 'granted',
      //   security_storage: 'granted'
      // });
    </script>

    <!-- Remove blocking Google Maps from the homepage to avoid console warnings & LCP impact.
         If you need Maps on a specific page, lazy-load it there with a valid API key. -->
    <!-- <script defer async src="https://maps.googleapis.com/maps/api/js?key=YOUR_REAL_KEY&libraries=places"></script> -->
  </head>

  <body class="text-blueGray-700 antialiased">
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
